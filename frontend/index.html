<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RailSarthi | Smarter Journeys for a Better Tomorrow</title>
  
  <!-- Fonts: Inter (Apple-like clean sans-serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS (Script CDN for fast prototype, but configured for light mode) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- MapLibre GL CSS & JS (100% Free Vector Map via OpenFreeMap, No API Key or Billing Required) -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom Styles (Glassmorphism & Theming) -->
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="text-gray-900 antialiased overflow-x-hidden">

  <!-- Shell Containers -->
  <div id="nav-container"></div>
  
  <!-- Main View Router Container -->
  <main id="app-content" class="min-h-[75vh]"></main>
  
  <div id="footer-container"></div>

  <!-- Bootstrap App module -->
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
